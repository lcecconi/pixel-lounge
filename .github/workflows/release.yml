name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 Platform & Build Tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build Signed APK
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist
          cp build/essential-launcher.apk dist/pixel-lounge.apk
          if [ -n "${{ github.ref_name }}" ]; then
            cp build/essential-launcher.apk "dist/pixel-lounge-${{ github.ref_name }}.apk"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
